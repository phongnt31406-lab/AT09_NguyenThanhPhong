# =====================================================================
# Cấu hình chạy test — RISE CRM
# Mọi giá trị có thể ghi đè từ dòng lệnh: mvn test -Dbrowser=edge -Dheadless=true
# hoặc biến môi trường cùng tên viết HOA, dấu "." thay bằng "_" (VD: HEADLESS=true)
# Tài khoản đăng nhập nằm ở configs/credentials.properties (không commit)
# =====================================================================

# ---------- Ứng dụng ----------
base.url=https://rise.anhtester.com

# ---------- Browser ----------
# chrome | edge | firefox   (video chỉ hỗ trợ chrome, edge)
browser=chrome
# false khi debug trên UI; true khi đã PASS ổn định và chạy hàng loạt
headless=false
window.width=1920
window.height=1080

# ---------- Timeout (giây) ----------
timeout.explicit=15
timeout.page.load=60

# ---------- Parallel ----------
# methods | classes | tests | none
parallel.mode=methods
thread.count=3
dataprovider.thread.count=3

# ---------- Test data (Excel) ----------
testdata.dir=src/test/resources/testdata

# ---------- Report ----------
reports.dir=reports
# Lưu thêm ảnh test FAIL ra reports/screenshots (ảnh luôn được đính vào Allure cho mọi test)
screenshot.fail.save.disk=true
# all = đính video mọi test | failed = chỉ test FAIL | off = không quay
video.mode=all
video.fps=5
video.max.width=1280
video.max.height=720
video.quality=60
video.max.seconds=300
